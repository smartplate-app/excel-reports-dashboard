<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:#0d0d1a; color:white; transition: 0.3s; }
.header { background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); padding:16px 20px; position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center; transition: 0.3s; }
.h-brand { font-size:22px; font-weight:900; color:white; }
.h-brand span { color:#f59e0b; }
.theme-toggle { background:rgba(255,255,255,0.1); border:none; color:white; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }

.tabs-bar { display:flex; background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); transition: 0.3s; }
.tab-btn { flex:1; padding:14px 0; border:none; font-size:14px; font-weight:700; cursor:pointer; background:transparent; color:rgba(255,255,255,0.35); border-bottom:3px solid transparent; transition:all 0.2s; }
.tab-btn.active { color:white; border-bottom:3px solid #f59e0b; background:rgba(245,158,11,0.06); }
.period-toggles { display:flex; gap:10px; margin-bottom:20px; justify-content:center; }
.period-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; transition:0.2s; }
.period-btn.active { background:#f59e0b; color:#fff; border-color:#f59e0b; }
.container { max-width:800px; margin:0 auto; padding:20px 12px 60px; }
.kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
.kpi-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:16px; text-align:center; transition: 0.3s; }
.kpi-lbl { font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:6px; font-weight:600; }
.kpi-val { font-size:22px; font-weight:800; margin-bottom:4px; transition: 0.3s; }
.kpi-sub { font-size:11px; color:rgba(255,255,255,0.3); }
.clr-green { color:#34d399; } .clr-orange { color:#fbbf24; } .clr-red { color:#f87171; }
.prime-box { background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(217,119,6,0.05)); border:1px solid rgba(245,158,11,0.2); border-radius:14px; padding:20px; text-align:center; margin-bottom:20px; transition: 0.3s; }
.prime-box .pl { font-size:13px; color:rgba(255,255,255,0.6); font-weight:600; margin-bottom:6px; }
.prime-box .pv { font-size:32px; font-weight:900; color:#fcd34d; }
.prime-box .ps { font-size:12px; color:rgba(245,158,11,0.6); margin-top:4px; }

.profit-box { background:linear-gradient(135deg,rgba(52,211,153,0.15),rgba(5,150,105,0.05)); border:1px solid rgba(52,211,153,0.2); border-radius:14px; padding:20px; text-align:center; margin-top:20px; transition: 0.3s; }
.profit-box .pl { font-size:15px; color:rgba(255,255,255,0.8); font-weight:700; margin-bottom:6px; }
.profit-box .pv { font-size:36px; font-weight:900; }
.profit-box .ps { font-size:14px; color:rgba(255,255,255,0.6); margin-top:4px; font-weight:600; }

.section { background:rgba(255,255,255,0.02); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.05); margin-bottom:20px; transition: 0.3s; }
.s-title { font-size:15px; font-weight:800; margin-bottom:16px; color:rgba(255,255,255,0.8); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; transition: 0.3s; }
.brk-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; transition: 0.3s; }
.brk-row:last-child { border-bottom:none; }
.brk-cat { color:rgba(255,255,255,0.6); }
.brk-val { font-weight:600; }

/* LIGHT MODE */
body.light-mode { background: #f8fafc; color: #0f172a; }

body.light-mode .brk-row { border-bottom-color: #f1f5f9; }

</style>

  html += '<div class="kpi-card"><div class="kpi-lbl">עלות שכר (ללא טיפ)</div><div class="kpi-val">'+fmt(labor)+' ₪</div><div class="kpi-sub">'+laborPct.toFixed(1)+'% מהמכירות</div></div>';
  html += '</div>';
  
  html += '<div class="prime-box"><div class="pl">עלויות תפעול (Prime Cost + עמלות וולט)</div><div class="pv '+pClr+'">'+totalPct.toFixed(1)+'%</div><div class="ps">יעד חברה: 63% &nbsp; | &nbsp; מזון: '+foodPct.toFixed(1)+'% &nbsp; | &nbsp; שכר: '+laborPct.toFixed(1)+'% &nbsp; | &nbsp; וולט: '+woltPct.toFixed(1)+'%</div></div>';
  
  // Breakdown
  let items = d.breakdown.filter(x => Math.abs(x.amount) > 100); 
  items.sort((a,b) => b.amount - a.amount);
  
  html += '<div class="section"><div class="s-title">פירוט הוצאות מלא (' + (currentPeriod==='may'?'מאי':'YTD') + ')</div>';
  items.forEach(it => {
    html += '<div class="brk-row"><div class="brk-cat">'+it.category+'</div><div class="brk-val">'+fmt(it.amount)+' ₪</div></div>';
  });
  html += '</div>';
  
  // Profit Box
  let profitColor = profit >= 0 ? '#10b981' : '#ef4444';
  let profitSign = profit > 0 ? '+' : '';
  if(isLight) { profitColor = profit >= 0 ? '#166534' : '#b91c1c'; }
  
  html += '<div class="profit-box" style="border-color: '+(profit>=0?'rgba(52,211,153,0.3)':'rgba(239,68,68,0.3)')+';">';
  html += '<div class="pl">רווח נקי משוער</div>';
  html += '<div class="pv" style="color:'+profitColor+';">'+profitSign+fmt(profit)+' ₪</div>';
  html += '<div class="ps">'+profitPct.toFixed(1)+'% ממחזור המכירות</div>';
  html += '</div>';
  
  document.getElementById('dashboard-content').innerHTML = html;
}

function setBranch(b) { currentBranch = b; render(); }
function setPeriod(p) { currentPeriod = p; render(); }

render();
</script>
</body>
</html>

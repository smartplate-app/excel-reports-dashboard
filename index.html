<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard - Monthly Reports (May 2026)</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:#0d0d1a; color:white; }
.header { background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); padding:16px 20px; position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center;}
.h-brand { font-size:22px; font-weight:900; color:white; }
.h-brand span { color:#f59e0b; }
.tabs-bar { display:flex; background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); }
.tab-btn { flex:1; padding:14px 0; border:none; font-size:14px; font-weight:700; cursor:pointer; background:transparent; color:rgba(255,255,255,0.35); border-bottom:3px solid transparent; transition:all 0.2s; }
.tab-btn.active { color:white; border-bottom:3px solid #f59e0b; background:rgba(245,158,11,0.06); }
.period-toggles { display:flex; gap:10px; margin-bottom:20px; justify-content:center; }
.period-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; transition:0.2s; }
.period-btn.active { background:#f59e0b; color:#fff; border-color:#f59e0b; }
.container { max-width:800px; margin:0 auto; padding:20px 12px 60px; }
.kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
.kpi-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:16px; text-align:center; }
.kpi-lbl { font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:6px; font-weight:600; }
.kpi-val { font-size:22px; font-weight:800; margin-bottom:4px; }
.kpi-sub { font-size:11px; color:rgba(255,255,255,0.3); }
.clr-green { color:#34d399; } .clr-orange { color:#fbbf24; } .clr-red { color:#f87171; }
.prime-box { background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(217,119,6,0.05)); border:1px solid rgba(245,158,11,0.2); border-radius:14px; padding:20px; text-align:center; margin-bottom:20px; }
.prime-box .pl { font-size:13px; color:rgba(255,255,255,0.6); font-weight:600; margin-bottom:6px; }
.prime-box .pv { font-size:32px; font-weight:900; color:#fcd34d; }
.prime-box .ps { font-size:12px; color:rgba(245,158,11,0.6); margin-top:4px; }
.section { background:rgba(255,255,255,0.02); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.05); margin-bottom:20px; }
.s-title { font-size:15px; font-weight:800; margin-bottom:16px; color:rgba(255,255,255,0.8); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; }
.brk-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; }
.brk-row:last-child { border-bottom:none; }
.brk-cat { color:rgba(255,255,255,0.6); }
.brk-val { font-weight:600; }
</style>
</head>
<body>

<div class="header">
  <div class="h-brand">📊 <span>P&L</span> Reports</div>
</div>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="setBranch('Einstein')" id="btn-Einstein">גורמה-תמצית</button>
  <button class="tab-btn" onclick="setBranch('Schuster')" id="btn-Schuster">קטנה תמצית</button>
  <button class="tab-btn" onclick="setBranch('Hod HaSharon')" id="btn-Hod HaSharon">בשרון תמצית</button>
</div>

<div class="container">
  <div class="period-toggles">
    <button class="period-btn active" onclick="setPeriod('may')" id="per-may">מאי 2026</button>
    <button class="period-btn" onclick="setPeriod('ytd')" id="per-ytd">2026 YTD</button>
  </div>
  
  <div id="dashboard-content"></div>
</div>

<script>
let DATA = null;
let currentBranch = 'Einstein';
let currentPeriod = 'may';

function fmt(n){ return Math.round(n).toLocaleString(); }

function render() {
  if(!DATA) return;
  const d = DATA[currentBranch][currentPeriod];
  
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+currentBranch).classList.add('active');
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('per-'+currentPeriod).classList.add('active');
  
  const sales = d.sales || 0;
  const food = d.food_cost || 0;
  const labor = d.labor_cost || 0;
  const wolt = d.wolt || 0;
  
  const foodPct = sales ? (food/sales)*100 : 0;
  const laborPct = sales ? (labor/sales)*100 : 0;
  const prime = foodPct + laborPct;
  const woltPct = sales ? (wolt/sales)*100 : 0;
  
  const pClr = prime <= 60 ? 'clr-green' : prime <= 65 ? 'clr-orange' : 'clr-red';
  
  let html = '<div class="kpi-grid">';
  html += '<div class="kpi-card"><div class="kpi-lbl">מכירות נטו</div><div class="kpi-val">'+fmt(sales)+' ₪</div></div>';
  html += '<div class="kpi-card"><div class="kpi-lbl">עמלות וולט</div><div class="kpi-val">'+fmt(wolt)+' ₪</div><div class="kpi-sub">'+woltPct.toFixed(1)+'% מהמכירות</div></div>';
  html += '<div class="kpi-card"><div class="kpi-lbl">עלות מזון נטו</div><div class="kpi-val">'+fmt(food)+' ₪</div><div class="kpi-sub">'+foodPct.toFixed(1)+'% מהמכירות</div></div>';
  html += '<div class="kpi-card"><div class="kpi-lbl">עלות שכר (ללא טיפ)</div><div class="kpi-val">'+fmt(labor)+' ₪</div><div class="kpi-sub">'+laborPct.toFixed(1)+'% מהמכירות</div></div>';
  html += '</div>';
  
  html += '<div class="prime-box"><div class="pl">Prime Cost (מזון + עבודה)</div><div class="pv '+pClr+'">'+prime.toFixed(1)+'%</div><div class="ps">יעד חברה: 63%</div></div>';
  
  // Breakdown
  let items = d.breakdown.filter(x => Math.abs(x.amount) > 100); // Filter out zero/tiny rows
  items.sort((a,b) => b.amount - a.amount);
  
  html += '<div class="section"><div class="s-title">פירוט הוצאות (' + (currentPeriod==='may'?'מאי':'YTD') + ')</div>';
  items.forEach(it => {
    html += '<div class="brk-row"><div class="brk-cat">'+it.category+'</div><div class="brk-val">'+fmt(it.amount)+' ₪</div></div>';
  });
  html += '</div>';
  
  document.getElementById('dashboard-content').innerHTML = html;
}

function setBranch(b) { currentBranch = b; render(); }
function setPeriod(p) { currentPeriod = p; render(); }
